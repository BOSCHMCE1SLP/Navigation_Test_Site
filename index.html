<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parametric CAD Workspace</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cad: {
              50: '#f8fafc',
              800: '#1e293b',
              900: '#0f172a',
              950: '#020617',
              accent: '#3b82f6',
            }
          }
        }
      }
    };
  </script>

  <!-- React 18 & ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (allows JSX compilation directly in-browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Three.js + OrbitControls + GLTFLoader CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    html, body, #root {
      min-height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background-color: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Main Application Script using In-Browser Babel -->
  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // --- Embedded Lightweight SVG Icons ---
    const IconBox = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
        <line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
    );

    const IconHeart = ({ className = "w-3.5 h-3.5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
      </svg>
    );

    const IconSearch = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
    );

    const IconSliders = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/>
        <line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/>
        <line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/>
        <line x1="1" x2="7" y1="14" y2="14"/><line x1="9" x2="15" y1="8" y2="8"/><line x1="17" x2="23" y1="16" y2="16"/>
      </svg>
    );

    const IconArrowLeft = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
      </svg>
    );

    const IconRefresh = ({ className = "w-3 h-3" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M8 16H3v5"/>
      </svg>
    );

    const IconSend = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    );

    const IconExternalLink = ({ className = "w-2.5 h-2.5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
      </svg>
    );

    // --- Mock Data Generator (130 items) ---
    const CATEGORIES = [
      'Decoration', 'Tools', 'Machinery', 'Power Transmission', 'Robotics', 'Fasteners', 'Structural'
    ];

    const PROCESSES = [
      '3D Printing', 'CNC Milling', 'CNC Turning', 'Laser Cutting', 'Sheet Metal', 'Injection Molding'
    ];

    const CREATORS = [
      { name: 'Dr. Elena Rostova', username: 'erostova', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&fit=crop&q=80' },
      { name: 'Marcus Vance', username: 'mvance_mech', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&fit=crop&q=80' },
      { name: 'Aoi Takahashi', username: 'aoi_proto', avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100&fit=crop&q=80' },
      { name: 'Julian Schmidt', username: 'jschmidt_cad', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&fit=crop&q=80' },
      { name: 'Maya Lin', username: 'mlin_designs', avatar: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=100&fit=crop&q=80' }
    ];

    const GRADIENTS = [
      'from-blue-600 to-indigo-900',
      'from-emerald-500 to-teal-900',
      'from-amber-500 to-stone-800',
      'from-rose-500 to-slate-900',
      'from-cyan-500 to-blue-900',
      'from-purple-600 to-slate-950'
    ];

    const BASE_TITLES = [
      'Heavy-Duty Flange Mount', 'Involute Spur Gear', 'Dual-Axis Gimbal Joint', 
      'Slotted Angle Bracket', 'Planetary Sun Carrier', 'T-Slot Framing Anchor', 
      'Spherical Bushing Housing', 'Precision Linear Slide', 'Collet Chuck Adapter', 
      'Heat Sink Fin Array', 'Robotic Gripper Finger', 'Modular DIN Enclosure', 
      'Helical Bevel Pinion', 'High-Torque Shaft Coupler', 'Ball-Screw Bearing Block'
    ];

    const MOCK_CAD_MODELS = Array.from({ length: 130 }, (_, index) => {
      const idNum = index + 1;
      const baseName = BASE_TITLES[index % BASE_TITLES.length];
      const variant = Math.floor(index / BASE_TITLES.length) + 1;
      const title = variant > 1 ? `${baseName} Mk-${variant}` : baseName;
      const creator = CREATORS[index % CREATORS.length];
      
      const primaryCat = CATEGORIES[index % CATEGORIES.length];
      const secondaryCat = CATEGORIES[(index + 3) % CATEGORIES.length];
      const cats = [primaryCat];
      if (index % 3 === 0 && primaryCat !== secondaryCat) cats.push(secondaryCat);

      const primaryProc = PROCESSES[index % PROCESSES.length];
      const procs = [primaryProc];
      if (index % 2 === 0) procs.push(PROCESSES[(index + 2) % PROCESSES.length]);

      return {
        id: `cad-model-${idNum.toString().padStart(3, '0')}`,
        title,
        creator: {
          name: creator.name,
          username: creator.username,
          profileUrl: `#/profile/${creator.username}`,
          avatarUrl: creator.avatar
        },
        categories: cats,
        manufacturingMethods: procs,
        description: `Parametric industrial component designed for high-stress cyclic loading. Optimized for rapid tooling and customized tolerances via dimensional input parameters.`,
        thumbnailGradient: GRADIENTS[index % GRADIENTS.length],
        likes: 15 + ((index * 37) % 450),
        createdAt: new Date(Date.now() - (130 - index) * 86400000 * 1.5).toISOString(),
        gltfUrl: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/BoxVertexColors/glTF-Binary/BoxVertexColors.glb',
        parameters: [
          { id: 'length', name: 'Total Length (L)', type: 'slider', value: 120 + ((index * 5) % 80), min: 50, max: 300, step: 5, unit: 'mm' },
          { id: 'width', name: 'Flange Width (W)', type: 'slider', value: 60 + ((index * 3) % 40), min: 30, max: 180, step: 2, unit: 'mm' },
          { id: 'thickness', name: 'Wall Thickness (T)', type: 'slider', value: 4 + (index % 8), min: 2, max: 20, step: 0.5, unit: 'mm' },
          { id: 'holeRadius', name: 'Bore Diameter (Ø)', type: 'number', value: 12 + (index % 16), min: 4, max: 50, step: 1, unit: 'mm' },
          { id: 'material', name: 'Raw Material Stock', type: 'select', value: index % 2 === 0 ? 'Aluminum 6061-T6' : 'PLA+ Carbon Fiber', options: ['Aluminum 6061-T6', 'Stainless Steel 316L', 'PLA+ Carbon Fiber', 'Acetal / Delrin', 'Titanium Gr. 5'] }
        ]
      };
    });

    // --- Component: GalleryView ---
    const GalleryView = ({ models, onSelectModel }) => {
      const [searchTerm, setSearchTerm] = useState('');
      const [sortBy, setSortBy] = useState('recent');
      const [selectedProcess, setSelectedProcess] = useState('All');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [pageSize, setPageSize] = useState(20);
      const [currentPage, setCurrentPage] = useState(1);

      const filteredModels = useMemo(() => {
        return models
          .filter((m) => {
            const matchSearch = m.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                m.creator.name.toLowerCase().includes(searchTerm.toLowerCase());
            const matchCat = selectedCategory === 'All' || m.categories.includes(selectedCategory);
            const matchProc = selectedProcess === 'All' || m.manufacturingMethods.includes(selectedProcess);
            return matchSearch && matchCat && matchProc;
          })
          .sort((a, b) => {
            if (sortBy === 'recent') return new Date(b.createdAt) - new Date(a.createdAt);
            return b.likes - a.likes;
          });
      }, [models, searchTerm, selectedCategory, selectedProcess, sortBy]);

      const totalItems = filteredModels.length;
      const totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
      const activePage = Math.min(currentPage, totalPages);

      const paginatedModels = useMemo(() => {
        const start = (activePage - 1) * pageSize;
        return filteredModels.slice(start, start + pageSize);
      }, [filteredModels, activePage, pageSize]);

      const pageNumbers = useMemo(() => {
        const pages = [];
        for (let i = Math.max(1, activePage - 2); i <= Math.min(totalPages, activePage + 2); i++) {
          pages.push(i);
        }
        return pages;
      }, [activePage, totalPages]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
          {/* Top Bar */}
          <header className="sticky top-0 z-30 border-b border-slate-800 bg-slate-900/90 backdrop-blur-md px-6 py-4 shadow-sm">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="p-2.5 bg-blue-600 rounded-xl text-white shadow-lg shadow-blue-500/20">
                  <IconBox className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    Parametric CAD Workspace
                    <span className="text-xs uppercase tracking-wider font-semibold bg-blue-500/10 text-blue-400 px-2.5 py-0.5 rounded-full border border-blue-500/20">
                      Standalone Edition
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400">Interactive parametric 3D CAD catalog</p>
                </div>
              </div>

              <div className="relative w-full md:w-80">
                <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
                  <IconSearch className="w-4 h-4" />
                </span>
                <input
                  type="text"
                  placeholder="Search 130 CAD components..."
                  value={searchTerm}
                  onChange={(e) => { setSearchTerm(e.target.value); setCurrentPage(1); }}
                  className="w-full bg-slate-800/80 text-sm text-slate-200 placeholder-slate-500 pl-10 pr-4 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-blue-500 transition-all"
                />
              </div>
            </div>
          </header>

          {/* Filter & Sort Bar */}
          <main className="max-w-7xl mx-auto w-full px-6 py-6 flex-1 flex flex-col">
            <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-800 mb-6 flex flex-wrap items-center justify-between gap-4">
              <div className="flex flex-wrap items-center gap-3">
                <div className="flex items-center gap-2">
                  <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Process:</span>
                  <select
                    value={selectedProcess}
                    onChange={(e) => { setSelectedProcess(e.target.value); setCurrentPage(1); }}
                    className="bg-slate-800 border border-slate-700 text-xs rounded-lg px-3 py-1.5 text-slate-200 focus:outline-none focus:border-blue-500"
                  >
                    <option value="All">All Processes</option>
                    {PROCESSES.map((p) => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>

                <div className="flex items-center gap-2">
                  <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Category:</span>
                  <select
                    value={selectedCategory}
                    onChange={(e) => { setSelectedCategory(e.target.value); setCurrentPage(1); }}
                    className="bg-slate-800 border border-slate-700 text-xs rounded-lg px-3 py-1.5 text-slate-200 focus:outline-none focus:border-blue-500"
                  >
                    <option value="All">All Categories</option>
                    {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
              </div>

              {/* Sort by Recent / Liked */}
              <div className="flex items-center gap-2">
                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Sort:</span>
                <div className="inline-flex rounded-lg border border-slate-700 bg-slate-800 p-0.5">
                  <button
                    type="button"
                    onClick={() => setSortBy('recent')}
                    className={`px-3 py-1 text-xs rounded-md transition-colors ${sortBy === 'recent' ? 'bg-blue-600 text-white font-medium' : 'text-slate-400 hover:text-white'}`}
                  >
                    Most Recent
                  </button>
                  <button
                    type="button"
                    onClick={() => setSortBy('likes')}
                    className={`px-3 py-1 text-xs rounded-md transition-colors ${sortBy === 'likes' ? 'bg-blue-600 text-white font-medium' : 'text-slate-400 hover:text-white'}`}
                  >
                    Most Liked
                  </button>
                </div>
              </div>
            </div>

            {/* Model Cards Grid */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-8">
              {paginatedModels.map((model) => (
                <div key={model.id} className="group bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl overflow-hidden flex flex-col shadow-md hover:shadow-xl transition-all duration-300">
                  <div className={`relative h-44 bg-gradient-to-tr ${model.thumbnailGradient} p-4 flex items-center justify-center overflow-hidden`}>
                    <div className="w-16 h-16 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center text-white shadow-xl group-hover:scale-105 transition-transform">
                      <IconBox className="w-8 h-8" />
                    </div>
                    <div className="absolute top-3 right-3 bg-slate-950/70 backdrop-blur-md border border-slate-700/50 rounded-full px-2.5 py-1 flex items-center gap-1.5 text-xs text-rose-300">
                      <IconHeart className="w-3.5 h-3.5 text-rose-500" />
                      <span className="font-semibold text-slate-200">{model.likes}</span>
                    </div>
                  </div>

                  <div className="p-5 flex-1 flex flex-col justify-between">
                    <div>
                      <div className="flex flex-wrap gap-1.5 mb-2.5">
                        {model.categories.map((cat) => (
                          <span key={cat} className="text-[10px] uppercase font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded-md">
                            {cat}
                          </span>
                        ))}
                        {model.manufacturingMethods.map((m) => (
                          <span key={m} className="text-[10px] uppercase font-semibold bg-slate-800 text-slate-300 border border-slate-700 px-2 py-0.5 rounded-md">
                            {m}
                          </span>
                        ))}
                      </div>

                      <h2 className="text-base font-semibold text-white group-hover:text-blue-400 transition-colors line-clamp-1 mb-1">
                        {model.title}
                      </h2>

                      <div className="flex items-center gap-2 mb-3">
                        <img src={model.creator.avatarUrl} alt={model.creator.name} className="w-5 h-5 rounded-full object-cover border border-slate-700" />
                        <span className="text-xs text-slate-400 flex items-center gap-1">
                          {model.creator.name}
                          <IconExternalLink className="w-2.5 h-2.5 opacity-60" />
                        </span>
                      </div>

                      <p className="text-xs text-slate-400 line-clamp-2 leading-relaxed">
                        {model.description}
                      </p>
                    </div>

                    <div className="pt-4 mt-4 border-t border-slate-800/80">
                      <button
                        type="button"
                        onClick={() => onSelectModel(model)}
                        className="w-full bg-slate-800 hover:bg-blue-600 text-slate-200 hover:text-white text-xs font-semibold py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-colors"
                      >
                        <IconBox className="w-3.5 h-3.5" />
                        View &amp; Customize
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {/* Pagination Controls */}
            <div className="mt-auto pt-6 border-t border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="text-xs text-slate-400">
                Showing <span className="font-semibold text-white">{Math.min(totalItems, (activePage - 1) * pageSize + 1)}</span> to{' '}
                <span className="font-semibold text-white">{Math.min(totalItems, activePage * pageSize)}</span> of{' '}
                <span className="font-semibold text-white">{totalItems}</span> models
              </div>

              <div className="flex items-center gap-4">
                <nav className="inline-flex items-center gap-1 bg-slate-900 border border-slate-800 p-1 rounded-xl text-xs">
                  <button
                    onClick={() => setCurrentPage(1)}
                    disabled={activePage === 1}
                    className="px-2.5 py-1.5 rounded-lg text-slate-400 hover:text-white disabled:opacity-30"
                  >
                    First
                  </button>
                  <button
                    onClick={() => setCurrentPage((p) => Math.max(1, p - 1))}
                    disabled={activePage === 1}
                    className="px-2.5 py-1.5 rounded-lg text-slate-400 hover:text-white disabled:opacity-30"
                  >
                    Prev
                  </button>

                  {pageNumbers.map((p) => (
                    <button
                      key={p}
                      onClick={() => setCurrentPage(p)}
                      className={`min-w-[32px] h-8 rounded-lg font-medium transition-colors ${p === activePage ? 'bg-blue-600 text-white font-semibold' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}
                    >
                      {p}
                    </button>
                  ))}

                  <button
                    onClick={() => setCurrentPage((p) => Math.min(totalPages, p + 1))}
                    disabled={activePage === totalPages}
                    className="px-2.5 py-1.5 rounded-lg text-slate-400 hover:text-white disabled:opacity-30"
                  >
                    Next
                  </button>
                  <button
                    onClick={() => setCurrentPage(totalPages)}
                    disabled={activePage === totalPages}
                    className="px-2.5 py-1.5 rounded-lg text-slate-400 hover:text-white disabled:opacity-30"
                  >
                    Last
                  </button>
                </nav>

                <div className="flex items-center gap-2">
                  <span className="text-xs text-slate-400">Per page:</span>
                  <select
                    value={pageSize}
                    onChange={(e) => { setPageSize(Number(e.target.value)); setCurrentPage(1); }}
                    className="bg-slate-900 border border-slate-700 text-xs rounded-lg px-2.5 py-1.5 text-slate-200"
                  >
                    <option value={10}>10</option>
                    <option value={20}>20</option>
                    <option value={50}>50</option>
                    <option value={100}>100</option>
                  </select>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    };

    // --- Component: ParameterPanel ---
    const ParameterPanel = ({ model, isApplying, onApplyParameters }) => {
      const [paramValues, setParamValues] = useState(() => {
        const initial = {};
        model.parameters.forEach((p) => { initial[p.id] = p.value; });
        return initial;
      });

      const handleChange = (id, val) => {
        setParamValues((prev) => ({ ...prev, [id]: val }));
      };

      const handleReset = () => {
        const defs = {};
        model.parameters.forEach((p) => { defs[p.id] = p.value; });
        setParamValues(defs);
      };

      return (
        <div className="h-full flex flex-col bg-slate-900 border-r border-slate-800">
          <div className="p-5 border-b border-slate-800 flex items-center justify-between">
            <div className="flex items-center gap-2.5">
              <div className="p-2 bg-blue-500/10 text-blue-400 rounded-lg border border-blue-500/20">
                <IconSliders className="w-4 h-4" />
              </div>
              <div>
                <h3 className="text-sm font-semibold text-white">Parametric Controls</h3>
                <p className="text-xs text-slate-400">Configure dimensional parameters</p>
              </div>
            </div>
            <button
              type="button"
              onClick={handleReset}
              disabled={isApplying}
              className="text-xs text-slate-400 hover:text-slate-200 flex items-center gap-1 px-2.5 py-1.5 rounded-lg hover:bg-slate-800 transition-colors"
            >
              <IconRefresh className="w-3 h-3" /> Reset
            </button>
          </div>

          <form className="flex-1 overflow-y-auto p-5 space-y-6" onSubmit={(e) => { e.preventDefault(); onApplyParameters(paramValues); }}>
            {model.parameters.map((p) => {
              const current = paramValues[p.id] ?? p.value;
              return (
                <div key={p.id} className="space-y-2">
                  <div className="flex items-center justify-between">
                    <label className="text-xs font-medium text-slate-300">{p.name}</label>
                    <span className="text-xs font-mono font-semibold text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded border border-blue-500/20">
                      {current} {p.unit || ''}
                    </span>
                  </div>

                  {p.type === 'slider' && (
                    <input
                      type="range"
                      min={p.min}
                      max={p.max}
                      step={p.step}
                      value={current}
                      disabled={isApplying}
                      onChange={(e) => handleChange(p.id, parseFloat(e.target.value))}
                      className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500"
                    />
                  )}

                  {p.type === 'number' && (
                    <input
                      type="number"
                      min={p.min}
                      max={p.max}
                      step={p.step}
                      value={current}
                      disabled={isApplying}
                      onChange={(e) => handleChange(p.id, parseFloat(e.target.value))}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs font-mono text-slate-200 focus:outline-none focus:border-blue-500"
                    />
                  )}

                  {p.type === 'select' && (
                    <select
                      value={current}
                      disabled={isApplying}
                      onChange={(e) => handleChange(p.id, e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500"
                    >
                      {p.options.map((opt) => <option key={opt} value={opt}>{opt}</option>)}
                    </select>
                  )}
                </div>
              );
            })}
          </form>

          <div className="p-5 border-t border-slate-800 bg-slate-950/50">
            <button
              type="button"
              disabled={isApplying}
              onClick={() => onApplyParameters(paramValues)}
              className="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white text-xs font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20 transition-all disabled:opacity-50"
            >
              {isApplying ? (
                <>
                  <span className="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin" />
                  Generating CAD Mesh...
                </>
              ) : (
                <>
                  <IconSend className="w-4 h-4" />
                  Apply Parameters
                </>
              )}
            </button>
          </div>
        </div>
      );
    };

    // --- Component: CadViewer (Three.js with OrbitControls) ---
    const CadViewer = ({ model, isApplying, appliedParams }) => {
      const mountRef = useRef(null);
      const sceneRef = useRef(null);
      const cameraRef = useRef(null);
      const rendererRef = useRef(null);
      const controlsRef = useRef(null);
      const meshGroupRef = useRef(null);
      const [wireframe, setWireframe] = useState(false);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#070b12');
        sceneRef.current = scene;

        // Camera
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(6, 5, 8);
        cameraRef.current = camera;

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        rendererRef.current = renderer;
        container.appendChild(renderer.domElement);

        // OrbitControls (LMB: Rotate, RMB: Pan, Scroll: Zoom)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controlsRef.current = controls;

        // Lights
        const ambient = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambient);

        const dir1 = new THREE.DirectionalLight(0xffffff, 1.6);
        dir1.position.set(10, 20, 10);
        scene.add(dir1);

        const dir2 = new THREE.DirectionalLight(0x38bdf8, 0.6);
        dir2.position.set(-10, -5, -10);
        scene.add(dir2);

        // Ground Grid
        const grid = new THREE.GridHelper(20, 40, 0x3b82f6, 0x1e293b);
        grid.position.y = -1.2;
        scene.add(grid);

        // Animation Loop
        let frameId;
        const animate = () => {
          frameId = requestAnimationFrame(animate);
          controls.update();
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!container || !camera || !renderer) return;
          camera.aspect = container.clientWidth / container.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(container.clientWidth, container.clientHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener('resize', handleResize);
          controls.dispose();
          renderer.dispose();
          if (container.contains(renderer.domElement)) container.removeChild(renderer.domElement);
        };
      }, []);

      // Build & Update Parametric Geometry
      useEffect(() => {
        const scene = sceneRef.current;
        if (!scene) return;

        if (meshGroupRef.current) {
          scene.remove(meshGroupRef.current);
        }

        const group = new THREE.Group();
        meshGroupRef.current = group;
        scene.add(group);

        // Calculate dynamic dimensions from applied parameters
        const length = appliedParams?.length ? appliedParams.length / 35 : 3.2;
        const width = appliedParams?.width ? appliedParams.width / 35 : 1.8;
        const thickness = appliedParams?.thickness ? appliedParams.thickness / 5 : 0.6;
        const holeRadius = appliedParams?.holeRadius ? appliedParams.holeRadius / 25 : 0.35;

        const mat = new THREE.MeshStandardMaterial({
          color: 0x38bdf8,
          metalness: 0.85,
          roughness: 0.25,
          wireframe
        });

        // Main Flange / Base Plate
        const baseGeo = new THREE.BoxGeometry(length, thickness, width);
        const baseMesh = new THREE.Mesh(baseGeo, mat);
        group.add(baseMesh);

        // Vertical Bracket Lug
        const lugGeo = new THREE.BoxGeometry(thickness, length * 0.6, width);
        const lugMesh = new THREE.Mesh(lugGeo, mat);
        lugMesh.position.set(-length / 2 + thickness / 2, (length * 0.6) / 2, 0);
        group.add(lugMesh);

        // Cylindrical Hole Marker
        const holeGeo = new THREE.CylinderGeometry(holeRadius, holeRadius, thickness * 1.3, 32);
        const holeMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9, roughness: 0.5, wireframe });
        const holeMesh = new THREE.Mesh(holeGeo, holeMat);
        holeMesh.position.set(length * 0.2, 0, 0);
        group.add(holeMesh);

      }, [model, appliedParams, wireframe]);

      return (
        <div className="relative w-full h-full bg-[#070b12] overflow-hidden select-none">
          <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing" />

          {/* Viewport Floating Controls */}
          <div className="absolute top-4 left-4 z-20 flex items-center gap-2 bg-slate-900/80 backdrop-blur-md border border-slate-800 p-1.5 rounded-xl">
            <button
              onClick={() => setWireframe(!wireframe)}
              className={`px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 ${wireframe ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}
            >
              <IconBox className="w-3.5 h-3.5" /> Wireframe
            </button>
            <button
              onClick={() => {
                if (cameraRef.current && controlsRef.current) {
                  cameraRef.current.position.set(6, 5, 8);
                  controlsRef.current.target.set(0, 0, 0);
                  controlsRef.current.update();
                }
              }}
              className="px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white"
            >
              Reset View
            </button>
          </div>

          <div className="absolute top-4 right-4 z-20 bg-slate-900/80 backdrop-blur-md border border-slate-800 px-3 py-2 rounded-xl text-right">
            <div className="text-xs font-semibold text-white">{model.title}</div>
            <div className="text-[10px] text-slate-400 font-mono">LMB: Rotate | RMB: Pan | Scroll: Zoom</div>
          </div>

          {/* Loading Spinner Overlay when "Apply Parameters" is clicked */}
          {isApplying && (
            <div className="absolute inset-0 z-30 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center text-center p-6">
              <div className="w-14 h-14 rounded-full border-4 border-blue-500/20 border-t-blue-500 animate-spin mb-4" />
              <h3 className="text-base font-semibold text-white">Regenerating Solid Geometry</h3>
              <p className="text-xs text-slate-400 mt-1 max-w-sm">Computing boundary curves and tessellating 3D mesh...</p>
            </div>
          )}
        </div>
      );
    };

    // --- Main Root App Component ---
    const App = () => {
      const [viewState, setViewState] = useState('gallery'); // 'gallery' | 'viewer'
      const [activeModel, setActiveModel] = useState(MOCK_CAD_MODELS[0]);
      const [isApplying, setIsApplying] = useState(false);
      const [appliedParams, setAppliedParams] = useState({});

      const handleSelectModel = (model) => {
        setActiveModel(model);
        setAppliedParams({});
        setViewState('viewer');
      };

      const handleApplyParameters = async (params) => {
        setIsApplying(true);
        // Simulate backend parametric re-meshing latency
        await new Promise((res) => setTimeout(res, 1200));
        setAppliedParams(params);
        setIsApplying(false);
      };

      return (
        <div className="w-screen h-screen overflow-hidden bg-slate-950 font-sans text-slate-100">
          {viewState === 'gallery' ? (
            <GalleryView
              models={MOCK_CAD_MODELS}
              onSelectModel={handleSelectModel}
            />
          ) : (
            <div className="w-full h-full flex flex-col">
              {/* Sticky Top Header */}
              <header className="h-14 bg-slate-900 border-b border-slate-800 px-5 flex items-center justify-between flex-shrink-0 z-20">
                <div className="flex items-center gap-4">
                  <button
                    type="button"
                    onClick={() => setViewState('gallery')}
                    className="inline-flex items-center gap-2 text-xs font-semibold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 px-3.5 py-1.5 rounded-lg border border-slate-700 transition-colors"
                  >
                    <IconArrowLeft className="w-4 h-4" />
                    Back to Gallery
                  </button>

                  <div className="h-5 w-[1px] bg-slate-800" />

                  <div className="flex items-center gap-2">
                    <IconBox className="w-4 h-4 text-blue-500" />
                    <span className="text-sm font-bold text-white">{activeModel.title}</span>
                    <span className="text-[11px] font-mono text-slate-400 bg-slate-800 px-2 py-0.5 rounded border border-slate-700">
                      {activeModel.id}
                    </span>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <button
                    onClick={() => alert(`Exporting STEP / glTF file for ${activeModel.title}`)}
                    className="text-xs font-semibold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition-colors"
                  >
                    Export 3D Model
                  </button>
                </div>
              </header>

              {/* Split-Pane 35% / 65% Layout */}
              <div className="flex-1 flex overflow-hidden">
                <section className="w-[35%] min-w-[320px] max-w-[460px] h-full flex-shrink-0 z-10">
                  <ParameterPanel
                    model={activeModel}
                    isApplying={isApplying}
                    onApplyParameters={handleApplyParameters}
                  />
                </section>
                <section className="flex-1 h-full relative">
                  <CadViewer
                    model={activeModel}
                    isApplying={isApplying}
                    appliedParams={appliedParams}
                  />
                </section>
              </div>
            </div>
          )}
        </div>
      );
    };

    // Mount React App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
